[package]
name = "nexus-workspace"
version = "0.1.0"
edition = "2021"

[dependencies]
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
