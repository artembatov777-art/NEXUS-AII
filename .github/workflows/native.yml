name: Native desktop quality

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libdbus-1-dev
      - name: Pin npm to stable Arborist release
        run: npm install --global npm@10.8.2
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Check whether Rust lockfile is already tracked
        if: runner.os == 'Linux'
        id: rust-lock
        run: |
          if git ls-files --error-unmatch src-tauri/Cargo.lock >/dev/null 2>&1; then
            echo "tracked=true" >> "$GITHUB_OUTPUT"
          else
            echo "tracked=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve generated Rust lockfile for repository review
        if: runner.os == 'Linux' && steps.rust-lock.outputs.tracked == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: nexus-rust-lock-${{ github.sha }}
          path: src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 1
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build native application without packaging installers
        run: npm run tauri build -- --no-bundle
      - name: Upload native executable for manual desktop smoke tests
        uses: actions/upload-artifact@v4
        with:
          name: nexus-au-${{ runner.os }}-${{ github.sha }}
          path: src-tauri/target/release/nexus-au*
          if-no-files-found: error
          retention-days: 7

  commit-lockfiles:
    needs: native
    if: github.ref == 'refs/heads/feat/nexus-core-architecture' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm to stable Arborist release
        run: npm install --global npm@10.8.2
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Rust dependency lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit dependency lockfiles on the protected working branch
        run: |
          git add package-lock.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Dependency lockfiles are already tracked and unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add dependency lockfiles for reproducible builds"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
