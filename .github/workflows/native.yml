name: Native desktop quality

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libdbus-1-dev
      - name: Pin npm to stable Arborist release
        run: npm install --global npm@10.8.2
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build native application without packaging installers
        run: npm run tauri build -- --no-bundle
      - name: Upload native executable for manual desktop smoke tests
        uses: actions/upload-artifact@v4
        with:
          name: nexus-au-${{ runner.os }}-${{ github.sha }}
          path: src-tauri/target/release/nexus-au*
          if-no-files-found: error
          retention-days: 7
