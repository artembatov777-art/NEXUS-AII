name: Quality

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm to stable Arborist release
        run: npm install --global npm@10.8.2
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Audit npm dependency advisories
        run: npm audit --audit-level=high
      - run: npm run test
      - run: npm run build
