name: Quality

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # Let the active validation finish; only the newest pending revision is retained.
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: 22
      - name: Verify immutable workflow action pins
        run: npm run check:workflow-pins
      - name: Pin npm to stable Arborist release
        run: npm install --global npm@10.8.2
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Audit npm dependency advisories
        run: npm audit --audit-level=high
      - run: npm run test
      - run: npm run build
