name: Quality

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Let the active validation finish; only the newest pending revision is retained.
  cancel-in-progress: false

jobs:
  web-api:
    name: Web/API tests and build
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: 22
      - name: Verify immutable workflow action pins
        run: npm run check:workflow-pins
      - name: Pin npm to stable Arborist release
        run: npm install --global npm@10.8.2
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run test:web-api
      - run: npm run build

  npm-production-security:
    name: Production npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high

  npm-security:
    name: Web/API and Desktop npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: 22
      - name: Audit full dependency tree including build and test tools
        run: npm audit --audit-level=high

  # Preserve the original frontend check as a gate for both jobs.
  frontend:
    if: always()
    needs: [web-api, npm-production-security, npm-security]
    runs-on: ubuntu-latest
    steps:
      - name: Require application and security checks
        env:
          WEB_RESULT: ${{ needs.web-api.result }}
          PRODUCTION_SECURITY_RESULT: ${{ needs.npm-production-security.result }}
          SECURITY_RESULT: ${{ needs.npm-security.result }}
        run: |
          test "$WEB_RESULT" = success &&
          test "$PRODUCTION_SECURITY_RESULT" = success &&
          test "$SECURITY_RESULT" = success
